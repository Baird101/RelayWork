<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">

<title>Relay</title>

<style>

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        background: #222;
        color: white;
    }

    #wrap {
        text-align: center;
        width: 90%;
    }

    #status {
        font-size: 20px;
        margin-bottom: 15px;
    }

    #lobby {
        white-space: pre-line;
        color: #aaa;
        font-size: 14px;
    }

    .spinner {
        display: inline-block;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {

        to {
            transform: rotate(360deg);
        }

    }

</style>

</head>

<body>

<div id="wrap">

    <div id="status">
        <span class="spinner">↻</span>
        Starting...
    </div>

    <div id="lobby"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script src="./p2pRelayScript.js"></script>

</body>

</html>
