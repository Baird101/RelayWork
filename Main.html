<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
 content="width=device-width,
 initial-scale=1.0,
 maximum-scale=1.0,
 user-scalable=no">

<title>Multiplayer Chat</title>

<style>

    :root {
        --background-color: #222;
    }

    html,
    body,
    #wrapper {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background-color:
            var(--background-color);

        font-family:
            sans-serif;
    }

    #wrapper {

        display: flex;

        justify-content:
            center;

        align-items:
            center;

    }

    #chat {

        width:
            600px;

        height:
            600px;

        background:
            white;

        display:
            flex;

        flex-direction:
            column;

        box-sizing:
            border-box;

    }

    /* ====================================================
       NAME SCREEN
       ==================================================== */

    #nameScreen {

        width:
            100%;

        height:
            100%;

        display:
            flex;

        flex-direction:
            column;

        justify-content:
            center;

        align-items:
            center;

        box-sizing:
            border-box;

        padding:
            30px;

    }

    #nameScreen h1 {

        margin:
            0 0 10px 0;

    }

    #nameScreen p {

        color:
            #666;

        margin:
            0 0 20px 0;

    }

    #nameInput {

        width:
            300px;

        box-sizing:
            border-box;

        padding:
            12px;

        font-size:
            18px;

        border:
            1px solid #aaa;

        outline:
            none;

    }

    #joinButton {

        width:
            300px;

        margin-top:
            10px;

        padding:
            12px;

        border:
            none;

        background:
            #333;

        color:
            white;

        font-size:
            16px;

        cursor:
            pointer;

    }

    #joinButton:hover {

        background:
            #555;

    }

    /* ====================================================
       CHAT
       ==================================================== */

    #chatScreen {

        width:
            100%;

        height:
            100%;

        display:
            none;

        flex-direction:
            column;

    }

    #messages {

        flex:
            1;

        overflow-y:
            auto;

        padding:
            12px;

        box-sizing:
            border-box;

        color:
            black;

        word-wrap:
            break-word;

    }

    .message {

        margin-bottom:
            8px;

    }

    .name {

        font-weight:
            bold;

    }

    #status {

        height:
            24px;

        padding:
            4px 10px;

        box-sizing:
            border-box;

        background:
            #ddd;

        color:
            #555;

        font-size:
            12px;

    }

    #inputArea {

        display:
            flex;

        height:
            45px;

        border-top:
            1px solid #aaa;

    }

    #messageInput {

        flex:
            1;

        border:
            none;

        padding:
            10px;

        font-size:
            16px;

        outline:
            none;

    }

    #sendButton {

        width:
            80px;

        border:
            none;

        background:
            #333;

        color:
            white;

        cursor:
            pointer;

    }

    #sendButton:hover {

        background:
            #555;

    }

</style>

</head>

<body>

<div id="wrapper">

<div id="chat">


<!-- ==================================================
     NAME SCREEN
     ================================================== -->

<div id="nameScreen">

    <h1>
        Join Lobby
    </h1>

    <p>
        Enter the name you want other users to see.
    </p>

    <input
        id="nameInput"
        type="text"
        placeholder="Your name"
        maxlength="20"
        autocomplete="off">

    <button id="joinButton">
        Join Lobby
    </button>

</div>


<!-- ==================================================
     CHAT SCREEN
     ================================================== -->

<div id="chatScreen">

    <div id="messages"></div>

    <div id="status">
        Connecting...
    </div>

    <div id="inputArea">

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off">

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


</div>

</div>

<script>

/* ============================================================
   NAME SCREEN
   ============================================================ */

var nameScreen =
    document.getElementById(
        "nameScreen"
    );

var nameInput =
    document.getElementById(
        "nameInput"
    );

var joinButton =
    document.getElementById(
        "joinButton"
    );

var chatScreen =
    document.getElementById(
        "chatScreen"
    );

var myName =
    "";

var hasJoined =
    false;


/* ============================================================
   CHAT ELEMENTS
   ============================================================ */

var messages =
    document.getElementById(
        "messages"
    );

var messageInput =
    document.getElementById(
        "messageInput"
    );

var sendButton =
    document.getElementById(
        "sendButton"
    );

var statusElement =
    document.getElementById(
        "status"
    );


/* ============================================================
   MESSAGE DISPLAY
   ============================================================ */

function addMessage(
    name,
    text
) {

    var div =
        document.createElement(
            "div"
        );

    div.className =
        "message";


    var nameSpan =
        document.createElement(
            "span"
        );

    nameSpan.className =
        "name";

    nameSpan.textContent =
        name + ": ";


    var textSpan =
        document.createElement(
            "span"
        );

    textSpan.textContent =
        text;


    div.appendChild(
        nameSpan
    );

    div.appendChild(
        textSpan
    );


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


function systemMessage(
    text
) {

    var div =
        document.createElement(
            "div"
        );

    div.className =
        "message";

    div.style.color =
        "#777";

    div.textContent =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* ============================================================
   RELAY SETTINGS
   ============================================================ */

var localDev =
    location.hostname === "localhost" ||
    location.hostname === "127.0.0.1";


var RELAY =
    localDev
    ?
    "./p2pRelay.html"
    :
    "https://baird101.github.io/RelayWork/p2pRelay.html";


var currentRoom =
    "main";


var signalWindow =
    null;


var relayReady =
    false;


var relayOpening =
    false;


/* ============================================================
   OPEN RELAY
   ============================================================ */

function openRelay(
    action
) {

    if (
        relayOpening
    ) {

        return false;

    }


    relayOpening =
        true;


    var url =
        new URL(
            RELAY,
            location.href
        );


    url.searchParams.set(
        "action",
        action
    );


    url.searchParams.set(
        "room",
        currentRoom
    );


    /*
     * Give the popup a unique name.
     */

    var popupName =
        "chat-relay-" +
        Math.random()
            .toString(36)
            .substring(2);


    signalWindow =
        window.open(

            url.toString(),

            popupName,

            "width=420,height=320"

        );


    relayOpening =
        false;


    if (
        !signalWindow
    ) {

        statusElement.textContent =
            "Popup blocked";

        systemMessage(
            "Allow popups for this site, then reload."
        );

        return false;

    }


    return true;

}


/* ============================================================
   CLOSE RELAY
   ============================================================ */

function closeRelay() {

    if (
        signalWindow &&
        !signalWindow.closed
    ) {

        try {

            signalWindow.close();

        }

        catch (err) {}

    }


    signalWindow =
        null;

    relayReady =
        false;

}


/* ============================================================
   SEND NAME TO RELAY
   ============================================================ */

function sendNameToRelay() {

    if (
        !signalWindow ||
        signalWindow.closed
    ) {

        return;

    }


    signalWindow.postMessage(

        {

            type:
                "set_name",

            room:
                currentRoom,

            name:
                myName

        },

        "*"

    );

}


/* ============================================================
   RELAY MESSAGE HANDLER
   ============================================================ */

window.addEventListener(

    "message",

    function(event) {

        /*
         * Only accept messages from
         * our relay popup.
         */

        if (
            !signalWindow ||
            event.source !== signalWindow
        ) {

            return;

        }


        var msg =
            event.data || {};


        /*
         * Ignore messages for
         * another room.
         */

        if (
            msg.room &&
            msg.room !== currentRoom
        ) {

            return;

        }


        /* ====================================================
           LOBBY CREATED
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "room_created"
        ) {

            window.chatPeerId =
                msg.peerId;


            statusElement.textContent =
                "Waiting for users...";


            systemMessage(
                "Lobby created. Waiting for other users."
            );


            /*
             * Tell the relay who we are.
             */

            sendNameToRelay();


            return;

        }


        /* ====================================================
           LOBBY ALREADY EXISTS
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "lobby_exists"
        ) {

            statusElement.textContent =
                "Lobby found. Joining...";


            closeRelay();


            setTimeout(

                function() {

                    openRelay(
                        "join"
                    );

                },

                250

            );


            return;

        }


        /* ====================================================
           JOINER CONNECTED
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "connected"
        ) {

            relayReady =
                true;


            window.chatPeerId =
                msg.peerId;


            statusElement.textContent =
                "Connected";


            sendNameToRelay();


            systemMessage(
                "You joined the lobby."
            );


            return;

        }


        /* ====================================================
           USER JOINED
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "user_joined"
        ) {

            if (
                msg.name
            ) {

                systemMessage(

                    msg.name +
                    " joined the lobby."

                );

            }

            return;

        }


        /* ====================================================
           USER LEFT
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "user_left"
        ) {

            if (
                msg.name
            ) {

                systemMessage(

                    msg.name +
                    " left the lobby."

                );

            }

            return;

        }


        /* ====================================================
           CHAT MESSAGE
           ==================================================== */

        if (
            msg.type === "chat"
        ) {

            /*
             * The sender already displayed
             * their own message.
             *
             * Therefore ignore our own
             * copy from the relay.
             */

            if (
                msg.senderId !==
                window.chatPeerId
            ) {

                addMessage(

                    msg.name ||
                    "Unknown",

                    msg.text ||
                    ""

                );

            }

            return;

        }


        /* ====================================================
           ERROR
           ==================================================== */

        if (
            msg.type === "relay_event" &&
            msg.peerEvent === "error"
        ) {

            statusElement.textContent =
                "Relay error";


            systemMessage(

                msg.detail ||
                "Unknown relay error."

            );


            return;

        }

    }

);


/* ============================================================
   SEND NAME TO RELAY
   ============================================================ */

function sendNameToRelay() {

    if (
        !signalWindow ||
        signalWindow.closed
    ) {

        return;

    }

    signalWindow.postMessage(

        {

            type:
                "set_name",

            name:
                myName

        },

        "*"

    );

}


/* ============================================================
   SEND CHAT
   ============================================================ */

function sendChat() {

    var text =
        messageInput.value.trim();


    if (
        text === ""
    ) {

        return;

    }


    if (
        !signalWindow ||
        signalWindow.closed ||
        !relayReady
    ) {

        systemMessage(
            "Not connected yet."
        );

        return;

    }


    var message = {

        type:
            "chat_send",

        room:
            currentRoom,

        name:
            myName,

        text:
            text,

        senderId:
            window.chatPeerId

    };


    /*
     * Display our own message immediately.
     */

    addMessage(
        myName,
        text
    );


    /*
     * Send it to the relay.
     */

    signalWindow.postMessage(
        message,
        "*"
    );


    messageInput.value =
        "";

    messageInput.focus();

}


/* ============================================================
   SEND BUTTON
   ============================================================ */

sendButton.onclick =
    sendChat;


messageInput.onkeydown =
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendChat();

        }

    };


/* ============================================================
   JOIN LOBBY
   ============================================================ */

function joinLobby() {

    currentRoom =
        "main";


    relayReady =
        false;


    statusElement.textContent =
        "Creating lobby...";


    openRelay(
        "create"
    );

}


/* ============================================================
   ENTER LOBBY
   ============================================================ */

function enterLobby() {

    var name =
        nameInput.value.trim();


    if (
        name === ""
    ) {

        nameInput.focus();

        return;

    }


    if (
        hasJoined
    ) {

        return;

    }


    hasJoined =
        true;


    myName =
        name;


    nameScreen.style.display =
        "none";


    chatScreen.style.display =
        "flex";


    joinLobby();

}


/* ============================================================
   NAME EVENTS
   ============================================================ */

joinButton.onclick =
    enterLobby;


nameInput.onkeydown =
    function(event) {

        if (
            event.key === "Enter"
        ) {

            enterLobby();

        }

    };


/* ============================================================
   START
   ============================================================ */

nameInput.focus();

</script>

</body>

</html>
