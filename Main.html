<!DOCTYPE html>
<!--
New stuff
 * Timestamps
 * Online user list
 * Cool UI
 * Fixed bugs on log in and log out messages
-->
<html>

<head>

	<meta charset="utf-8">

	<meta name="viewport">

	<title>Multiperson Chat</title>

	<style>
		:root {
			--background-color: #222;
		}

		html,
		body,
		#wrapper {
			overflow: hidden;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			background-color: black;
			font-family: Comic Sans Ms;
		}

		#wrapper {
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#chat {
			width: 600px;
			height: 600px;
			background: linear-gradient(var(--angle), rgb(87, 0, 0), rgb(0, 0, 0));
			display: flex;
			flex-direction: column;
			box-sizing: border-box;
			position: relative;
		}

		#nameScreen {
			background: linear-gradient(var(--angle), rgb(87, 0, 0), rgb(0, 0, 0));
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			box-sizing: border-box;
			padding: 30px;
		}

		#nameScreen h1 {
			color: rgba(255, 255, 255, 0.5);
			margin: 0 0 10px 0;
		}

		#nameScreen p {
			color: white;
			margin: 0 0 20px 0;
		}

		#nameInput {
			width: 300px;
			box-sizing: border-box;
			padding: 12px;
			font-size: 18px;
			border: 5px ridge rgb(255, 255, 255);
			background: rgba(255, 255, 255, 0.4);
			color: white;
		}

		#nameInput:hover {
			background: rgba(255, 255, 255, 0.5);
		}

		#nameInput::placeholder {
			color: rgba(255, 255, 255, 0.6);
		}

		#joinButton {
			width: 300px;
			margin-top: 10px;
			padding: 12px;
			background: rgba(255, 255, 255, 0.4);
			color: white;
			font-size: 16px;
			cursor: pointer;
			border: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#joinButton:hover {
			background: rgba(255, 255, 255, 0.5);
		}

		#chatScreen {
			width: 100%;
			height: 100%;
			display: none;
			flex-direction: column;
		}

		#messages {
			flex: 1;
			overflow-y: auto;
			padding: 12px;
			box-sizing: border-box;
			color: rgba(255, 255, 255, 0.7);
			word-wrap: break-word;
		}

		.message {
			margin-bottom: 8px;
			max-width: 460px;
			overflow-wrap: anywhere;
			word-break: break-word;
		}

		.messageHeader {
			display: flex;
			align-items: baseline;
			gap: 6px;
		}

		.messageText {
			margin-top: 2px;
		}

		.name {
			font-weight: bold;
		}

		.timestamp {
			color: rgba(255, 255, 255, 0.4);
			font-size: 11px;
			margin-right: 5px;
			margin-left: 8px;
		}

		#status {
			height: 26px;
			padding: 4px 10px 20px;
			box-sizing: border-box;
			background: rgba(255, 255, 255, 0.2);
			color: white;
			font-size: 12px;
			border-top: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#inputArea {
			display: flex;
			height: 45px;
		}

		#messageInput {
			flex: 1;
			border: none;
			padding: 10px;
			font-size: 16px;
			background: rgba(255, 255, 255, 0.7);
			border-top: 5px ridge rgba(255, 255, 255, 0.5);
		}

		#sendButton {
			width: 80px;
			border: 5px ridge rgba(255, 255, 255, 0.5);
			background: #333;
			color: white;
			cursor: pointer;
		}

		#sendButton:hover {
			background: #555;
		}

		#userList {
			position: absolute;
			top: 10px;
			right: 10px;
			width: 140px;
			max-height: 200px;
			padding: 8px;
			box-sizing: border-box;
			background: rgba(0, 0, 0, 0.65);
			border: 2px solid rgba(255, 255, 255, 0.4);
			color: white;
			font-size: 13px;
			z-index: 10;
			overflow: hidden;
		}

		#users {
			max-height: 155px;
			overflow-y: auto;
			overflow-x: hidden;
		}

		#userListTitle {
			font-weight: bold;
			margin-bottom: 6px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.3);
			padding-bottom: 4px;
		}

		.user {
			padding: 2px 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
	</style>

</head>

<body>

	<div id="wrapper">

		<div id="chat">

			<div id="nameScreen">

				<h1>Sign up</h1>

				<p>
					Enter the name you want other users to see.
				</p>

				<input id="nameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off">

				<button id="joinButton">
					Join Chat
				</button>

				<p>
					<br>
					Once a second window pops up do not close it otherwise it won't work
				</p>

			</div>

			<div id="chatScreen">

				<div id="userList">

					<div id="userListTitle">
						Users Online
					</div>

					<div id="users">
					</div>

				</div>

				<div id="messages"></div>

				<div id="status">
					Connecting...
				</div>

				<div id="inputArea">

					<input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">

					<button id="sendButton">
						Send
					</button>

				</div>

			</div>

		</div>

	</div>

	<script>
		var angle = 0;

		function update() {
			angle += 0.1;
			document.body.style.setProperty("--angle", angle + "deg");
			requestAnimationFrame(update);
		}

		update();

		var nameScreen = document.getElementById("nameScreen");
		var nameInput = document.getElementById("nameInput");
		var joinButton = document.getElementById("joinButton");
		var chatScreen = document.getElementById("chatScreen");
		var myName = "";
		var hasJoined = false;
		var messages = document.getElementById("messages");
		var messageInput = document.getElementById("messageInput");
		var sendButton = document.getElementById("sendButton");
		var statusElement = document.getElementById("status");
		var usersElement = document.getElementById("users");

		function updateUserList(users) {
			lobbyUsers = users.slice();

			usersElement.innerHTML = "";

			for (var i = 0; i < users.length; i++) {
				var user = document.createElement("div");

				user.className = "user";
				user.textContent = users[i].name || "Unknown";
				usersElement.appendChild(user);
			}
		}

		/*
		 * This stores the PeerJS ID belonging
		 * to THIS Main.html window.
		 *
		 * The host gets this from room_created.
		 * Joiners get it from connected.
		 */

		window.chatPeerId = "";

		function addMessage(name, text, timestamp) {
			var div = document.createElement("div");

			div.className = "message";

			var header = document.createElement("div");
			header.className = "messageHeader";

			var nameSpan = document.createElement("span");
			nameSpan.className = "name";
			nameSpan.textContent = name;

			var timeSpan = document.createElement("span");
			timeSpan.className = "timestamp";

			timeSpan.textContent = timestamp
				? new Intl.DateTimeFormat(undefined, {
					hour: "numeric",
					minute: "2-digit"
				}).format(new Date(timestamp))
				: "";

			header.appendChild(nameSpan);
			header.appendChild(timeSpan);

			var textSpan = document.createElement("div");
			textSpan.className = "messageText";
			textSpan.textContent = text;

			div.appendChild(header);
			div.appendChild(textSpan);

			messages.appendChild(div);
			messages.scrollTop = messages.scrollHeight;
		}

        function systemMessage(text, timestamp) {
        	var div = document.createElement("div");
        
        	div.className = "message";
        	div.style.color = "#777";
        
        	var textSpan = document.createElement("span");
        	textSpan.textContent = text;
        
        	div.appendChild(textSpan);
        
        	if (timestamp) {
        		var timeSpan = document.createElement("span");
        
        		timeSpan.className = "timestamp";
        		timeSpan.textContent = new Intl.DateTimeFormat(undefined, {
        			hour: "numeric",
        			minute: "2-digit"
        		}).format(new Date(timestamp));
        
        		div.appendChild(timeSpan);
        	}
        
        	messages.appendChild(div);
        	messages.scrollTop = messages.scrollHeight;
        }

		var localDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";

		var RELAY = localDev
			? "./p2pRelay.html"
			: "https://baird101.github.io/RelayWork/p2pRelay.html";

		var currentRoom = "main";
		var signalWindow = null;
		var relayReady = false;
		var relayOpening = false;

		var lobbyUsers = [];
		var currentHostId = "";
		var migratingHost = false;


		var tryingToBecomeHost = false;
		
		function openRelay(action) {
			if (relayOpening) {
				return false;
			}

			relayOpening = true;

			var url = new URL(RELAY, location.href);

			url.searchParams.set("action", action);
			url.searchParams.set("room", currentRoom);

			var popupName = "chat-relay-" + Math.random().toString(36).substring(2);

			signalWindow = window.open(
				url.toString(),
				popupName,
				"width=420,height=320"
			);

			relayOpening = false;

			if (!signalWindow) {
				statusElement.textContent = "Popup blocked";
				systemMessage("Allow popups for this site, then reload.");
				return false;
			}

			return true;
		}

		function closeRelay() {
			if (signalWindow && !signalWindow.closed) {
				try {
					signalWindow.close();
				}
				catch (err) {}
			}

			signalWindow = null;
			relayReady = false;
		}

		function sendNameToRelay() {
			if (!signalWindow || signalWindow.closed) {
				return;
			}

			signalWindow.postMessage({
				type: "set_name",
				room: currentRoom,
				name: myName
			}, "*");
		}
		
		function getNextHost() {
			var candidates = [];

			for (var i = 0; i < lobbyUsers.length; i++) {
				if (
					lobbyUsers[i].peerId &&
					lobbyUsers[i].peerId !== currentHostId
				) {
					candidates.push(lobbyUsers[i]);
				}
			}

			if (candidates.length === 0) {
				return null;
			}

			candidates.sort(function(a, b) {
				return a.peerId < b.peerId ? -1 : 1;
			});

			return candidates[0];
		}

		function migrateHost() {
			if (migratingHost) {
				return;
			}

			migratingHost = true;
			relayReady = false;

			var nextHost = getNextHost();

			if (!nextHost) {
				statusElement.textContent = "Lobby empty.";
				migratingHost = false;
				return;
			}

			statusElement.textContent = "Host left. Rebuilding lobby...";

			closeRelay();

			setTimeout(function() {
				if (nextHost.peerId === window.chatPeerId) {
					statusElement.textContent = "Becoming host...";
					tryingToBecomeHost = true;
					openRelay("create");
					return;
				}

				statusElement.textContent =
					"Waiting for " +
					nextHost.name +
					" to become host...";

				setTimeout(function() {
					if (!migratingHost) {
						return;
					}

					openRelay("join");
				}, 1000);
			}, 500);
		}
		window.addEventListener("message", function(event) {
			/*
			 * Only accept messages from
			 * our relay popup.
			 */

			if (!signalWindow || event.source !== signalWindow) {
				return;
			}

			var msg = event.data || {};

			if (msg.type === "relay_event" && msg.peerEvent === "user_list") {
				updateUserList(msg.users || []);
				return;
			}

			console.log("Main received from relay:", msg);

			if (msg.room && msg.room !== currentRoom) {
				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "lobby_exists") {
				if (tryingToBecomeHost) {
					closeRelay();

					setTimeout(function() {
						openRelay("create");
					}, 500);

					return;
				}

				statusElement.textContent = "Lobby found. Joining...";
				closeRelay();

				setTimeout(function() {
					openRelay("join");
				}, 250);

				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "room_created") {
				tryingToBecomeHost = false;
				migratingHost = false;

				relayReady = true;
				window.chatPeerId = msg.peerId || "";
				currentHostId = msg.peerId || "";

				statusElement.textContent = "Connected";
				sendNameToRelay();
				systemMessage("You connected to the lobby.");

				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "connected") {
				relayReady = true;
				window.chatPeerId = msg.peerId || "";
				currentHostId = msg.detail || "";

				statusElement.textContent = "Connected";
				sendNameToRelay();
				systemMessage("You connected to the lobby.");

				return;
			}
			
			if (msg.type === "relay_event" && msg.peerEvent === "user_joined") {
				if (msg.name) {
					systemMessage(msg.name + " joined the lobby.", msg.timestamp);
				}

				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "user_left") {
				if (msg.name) {
					systemMessage(msg.name + " left the lobby.", msg.timestamp);
				}

				for (var i = 0; i < lobbyUsers.length; i++) {
					if (lobbyUsers[i].peerId === msg.peerId) {
						lobbyUsers.splice(i, 1);
						break;
					}
				}

				updateUserList(lobbyUsers);

				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "host_left") {
				currentHostId = msg.peerId || currentHostId;

				if (msg.name) {
					systemMessage(
						msg.name + " left the lobby.",
						msg.timestamp
					);
				}

				migrateHost();

				return;
			}

			if (msg.type === "chat") {
				/*
				 * The sender already displayed
				 * their own message locally.
				 *
				 * If the sender ID matches this
				 * Main.html's PeerJS ID, ignore
				 * the relay copy.
				 */

				if (msg.senderId !== window.chatPeerId) {
					addMessage(msg.name || "Unknown", msg.text || "", msg.timestamp);
				}

				return;
			}

			if (msg.type === "relay_event" && msg.peerEvent === "error") {
				statusElement.textContent = "Relay error";
				systemMessage(msg.detail || "Unknown relay error.");
				return;
			}
		});

		function sendChat() {
			var text = messageInput.value.trim();

			if (text === "") {
				return;
			}

			if (!signalWindow || signalWindow.closed || !relayReady) {
				systemMessage("Not connected yet.");
				return;
			}

			var message = {
				type: "chat_send",
				room: currentRoom,
				name: myName,
				text: text,
				senderId: window.chatPeerId,
				timestamp: Date.now()
			};

			/*
			 * Display our own message immediately.
			 */

			addMessage(myName, text, message.timestamp);

			/*
			 * Send to relay.
			 */

			signalWindow.postMessage(message, "*");

			messageInput.value = "";
			messageInput.focus();
		}

		sendButton.onclick = sendChat;

		messageInput.onkeydown = function(event) {
			if (event.key === "Enter") {
				sendChat();
			}
		};

		function joinLobby() {
			currentRoom = "main";
			relayReady = false;
			statusElement.textContent = "Creating lobby...";
			openRelay("create");
		}

		function enterLobby() {
			var name = nameInput.value.trim();

			if (name === "") {
				nameInput.focus();
				return;
			}

			if (hasJoined) {
				return;
			}

			hasJoined = true;
			myName = name;

			nameScreen.style.display = "none";
			chatScreen.style.display = "flex";

			joinLobby();
		}

		joinButton.onclick = enterLobby;

		nameInput.onkeydown = function(event) {
			if (event.key === "Enter") {
				enterLobby();
			}
		};
	</script>

</body>

</html>
