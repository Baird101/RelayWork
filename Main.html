<!DOCTYPE html>

<html>

<head>

	<meta charset="utf-8">

	<meta name="viewport">

	<title>Multiplayer Chat</title>

	<style>
		:root {
			--background-color: #222;
		}

		html,
		body,
		#wrapper {
			overflow: hidden;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			background-color:
				var(--background-color);

			font-family:
				sans-serif;
		}

		#wrapper {

			display: flex;

			justify-content:
				center;

			align-items:
				center;

		}

		#chat {

			width:
				600px;

			height:
				600px;

			background:
				white;

			display:
				flex;

			flex-direction:
				column;

			box-sizing:
				border-box;

		}

		#nameScreen {

			background:
				linear-gradient(
					var(--angle),
					rgb(87, 0, 0),
					rgb(0, 0, 0)
				);

			width:
				100%;

			height:
				100%;

			display:
				flex;

			flex-direction:
				column;

			justify-content:
				center;

			align-items:
				center;

			box-sizing:
				border-box;

			padding:
				30px;

		}

		#nameScreen h1 {

			margin:
				0 0 10px 0;

		}

		#nameScreen p {

			color:
				#666;

			margin:
				0 0 20px 0;

		}

		#nameInput {

			width:
				300px;

			box-sizing:
				border-box;

			padding:
				12px;

			font-size:
				18px;

			border:
				1px solid #aaa;

			outline:
				none;

		}

		#joinButton {

			width:
				300px;

			margin-top:
				10px;

			padding:
				12px;

			border:
				none;

			background:
				#333;

			color:
				white;

			font-size:
				16px;

			cursor:
				pointer;

		}

		#joinButton:hover {

			background:
				#555;

		}

		#chatScreen {

			width:
				100%;

			height:
				100%;

			display:
				none;

			flex-direction:
				column;

		}

		#messages {

			flex:
				1;

			overflow-y:
				auto;

			padding:
				12px;

			box-sizing:
				border-box;

			color:
				black;

			word-wrap:
				break-word;

		}

		.message {

			margin-bottom:
				8px;

		}

		.name {

			font-weight:
				bold;

		}

		#status {

			height:
				24px;

			padding:
				4px 10px;

			box-sizing:
				border-box;

			background:
				#ddd;

			color:
				#555;

			font-size:
				12px;

		}

		#inputArea {

			display:
				flex;

			height:
				45px;

			border-top:
				1px solid #aaa;

		}

		#messageInput {

			flex:
				1;

			border:
				none;

			padding:
				10px;

			font-size:
				16px;

			outline:
				none;

		}

		#sendButton {

			width:
				80px;

			border:
				none;

			background:
				#333;

			color:
				white;

			cursor:
				pointer;

		}

		#sendButton:hover {

			background:
				#555;

		}
	</style>

</head>

<body>

	<div id="wrapper">

		<div id="chat">

			<div id="nameScreen">

				<h1>Sign up</h1>

				<p>
					Enter the name you want other users to see.
				</p>

				<input
					id="nameInput"
					type="text"
					placeholder="Your name"
					maxlength="20"
					autocomplete="off"
				>

				<button id="joinButton">
					Join Chat
				</button>

				<p>
					<br>
					A small connection window may appear while joining.
				</p>

			</div>


			<div id="chatScreen">

				<div id="messages"></div>

				<div id="status">
					Connecting...
				</div>

				<div id="inputArea">

					<input
						id="messageInput"
						type="text"
						placeholder="Type a message..."
						autocomplete="off"
					>

					<button id="sendButton">
						Send
					</button>

				</div>

			</div>

		</div>

	</div>


	<script>

		/* =====================================================
		   BASIC ELEMENTS
		   ===================================================== */

		var nameScreen =
			document.getElementById("nameScreen");

		var nameInput =
			document.getElementById("nameInput");

		var joinButton =
			document.getElementById("joinButton");

		var chatScreen =
			document.getElementById("chatScreen");

		var messages =
			document.getElementById("messages");

		var messageInput =
			document.getElementById("messageInput");

		var sendButton =
			document.getElementById("sendButton");

		var statusElement =
			document.getElementById("status");


		/* =====================================================
		   PLAYER DATA
		   ===================================================== */

		var myName =
			"";

		var hasJoined =
			false;

		var currentRoom =
			"main";


		/* =====================================================
		   RELAY
		   ===================================================== */

		var localDev =
			location.hostname === "localhost" ||
			location.hostname === "127.0.0.1";


		var RELAY =
			localDev
				? "./p2pRelay.html"
				: "https://baird101.github.io/RelayWork/p2pRelay.html";


		var signalWindow =
			null;


		var relayReady =
			false;


		var relayOpening =
			false;


		/* =====================================================
		   WEBRTC CONNECTIONS
		   ===================================================== */

		/*
		 * Every player gets their own RTCPeerConnection.
		 *
		 * Key:
		 *     remote peer ID
		 *
		 * Value:
		 *     connection information
		 */

		var peerConnections =
			{};


		/*
		 * Data channels belonging to each player.
		 */

		var dataChannels =
			{};


		/*
		 * Names belonging to each PeerJS ID.
		 */

		var playerNames =
			{};


		/*
		 * Our PeerJS ID.
		 */

		var myPeerId =
			"";


		/*
		 * Are we the lobby host?
		 */

		var isHost =
			false;


		/*
		 * Messages waiting for the relay.
		 */

		var signalQueue =
			[];


		/* =====================================================
		   MESSAGE DISPLAY
		   ===================================================== */

		function addMessage(
			name,
			text
		) {

			var div =
				document.createElement(
					"div"
				);

			div.className =
				"message";


			var nameSpan =
				document.createElement(
					"span"
				);

			nameSpan.className =
				"name";

			nameSpan.textContent =
				name +
				": ";


			var textSpan =
				document.createElement(
					"span"
				);

			textSpan.textContent =
				text;


			div.appendChild(
				nameSpan
			);

			div.appendChild(
				textSpan
			);


			messages.appendChild(
				div
			);


			messages.scrollTop =
				messages.scrollHeight;

		}


		function systemMessage(
			text
		) {

			var div =
				document.createElement(
					"div"
				);

			div.className =
				"message";

			div.style.color =
				"#777";

			div.textContent =
				text;


			messages.appendChild(
				div
			);


			messages.scrollTop =
				messages.scrollHeight;

		}


		/* =====================================================
		   OPEN RELAY
		   ===================================================== */

		function openRelay(
			action
		) {

			if (
				relayOpening
			) {

				return false;

			}


			relayOpening =
				true;


			var url =
				new URL(
					RELAY,
					location.href
				);


			url.searchParams.set(
				"action",
				action
			);


			url.searchParams.set(
				"room",
				currentRoom
			);


			var popupName =
				"chat-relay-" +
				Math.random()
					.toString(36)
					.substring(2);


			signalWindow =
				window.open(

					url.toString(),

					popupName,

					"width=420,height=320"

				);


			relayOpening =
				false;


			if (
				!signalWindow
			) {

				statusElement.textContent =
					"Popup blocked";

				systemMessage(
					"Allow popups for this site, then reload."
				);

				return false;

			}


			return true;

		}


		/* =====================================================
		   CLOSE RELAY
		   ===================================================== */

		function closeRelay() {

			if (
				signalWindow &&
				!signalWindow.closed
			) {

				try {

					signalWindow.close();

				}

				catch (error) {}

			}


			signalWindow =
				null;

			relayReady =
				false;

		}


		/* =====================================================
		   SEND NAME
		   ===================================================== */

		function sendNameToRelay() {

			if (
				!signalWindow ||
				signalWindow.closed ||
				!relayReady
			) {

				return;

			}


			signalWindow.postMessage(

				{

					type:
						"set_name",

					room:
						currentRoom,

					name:
						myName,

					peerId:
						myPeerId

				},

				"*"

			);

		}


		/* =====================================================
		   SEND SIGNAL THROUGH RELAY
		   ===================================================== */

		function sendSignal(
			targetPeerId,
			payload
		) {

			var message =
				{

					type:
						"signal_send",

					room:
						currentRoom,

					target:
						targetPeerId,

					from:
						myPeerId,

					payload:
						payload

				};


			if (
				signalWindow &&
				!signalWindow.closed &&
				relayReady
			) {

				try {

					signalWindow.postMessage(
						message,
						"*"
					);

					return;

				}

				catch (error) {}

			}


			/*
			 * Relay isn't ready yet.
			 */

			signalQueue.push(
				message
			);

		}


		/* =====================================================
		   FLUSH SIGNAL QUEUE
		   ===================================================== */

		function flushSignalQueue() {

			if (
				!signalWindow ||
				signalWindow.closed ||
				!relayReady
			) {

				return;

			}


			while (
				signalQueue.length > 0
			) {

				var message =
					signalQueue.shift();


				try {

					signalWindow.postMessage(
						message,
						"*"
					);

				}

				catch (error) {

					signalQueue.unshift(
						message
					);

					return;

				}

			}

		}


		/* =====================================================
		   CREATE WEBRTC CONNECTION
		   ===================================================== */

		function createConnection(
			remotePeerId,
			makeOffer
		) {

			/*
			 * Don't create the same connection twice.
			 */

			if (
				peerConnections[
					remotePeerId
				]
			) {

				return peerConnections[
					remotePeerId
				];

			}


			var pc =
				new RTCPeerConnection({

					iceServers: [

						{

							urls:
								"stun:stun.l.google.com:19302"

						}

					]

				});


			peerConnections[
				remotePeerId
			] =
				pc;


			/*
			 * ICE candidates.
			 */

			pc.onicecandidate =
				function(event) {

					if (
						event.candidate
					) {

						sendSignal(

							remotePeerId,

							{

								kind:
									"candidate",

								candidate:
									event.candidate.toJSON()

							}

						);

					}

				};


			/*
			 * Connection state.
			 */

			pc.onconnectionstatechange =
				function() {

					if (
						pc.connectionState ===
						"connected"
					) {

						statusElement.textContent =
							"Connected players: " +
							countConnections();


						/*
						 * Once the direct WebRTC
						 * connection works, we no
						 * longer need the relay for
						 * THIS connection.
						 */

						if (
							!isHost
						) {

							closeRelay();

						}

					}


					if (
						pc.connectionState ===
						"failed" ||
						pc.connectionState ===
						"closed"
					) {

						removeConnection(
							remotePeerId
						);

					}

				};


			/*
			 * Joiner receives a DataChannel
			 * from the host.
			 */

			pc.ondatachannel =
				function(event) {

					setupDataChannel(

						remotePeerId,

						event.channel

					);

				};


			/*
			 * Host creates the DataChannel.
			 */

			if (
				makeOffer
			) {

				var channel =
					pc.createDataChannel(
						"chat"
					);


				setupDataChannel(

					remotePeerId,

					channel

				);


				pc.createOffer()

					.then(

						function(offer) {

							return pc.setLocalDescription(
								offer
							);

						}

					)

					.then(

						function() {

							sendSignal(

								remotePeerId,

								{

									kind:
										"offer",

									description:
										pc.localDescription

								}

							);

						}

					)

					.catch(

						function(error) {

							systemMessage(
								"WebRTC error: " +
								error.message
							);

						}

					);

			}


			return pc;

		}


		/* =====================================================
		   DATA CHANNEL
		   ===================================================== */

		function setupDataChannel(
			remotePeerId,
			channel
		) {

			dataChannels[
				remotePeerId
			] =
				channel;


			channel.onopen =
				function() {

					statusElement.textContent =
						"Connected players: " +
						countConnections();

				};


			channel.onmessage =
				function(event) {

					var data =
						event.data;


					if (
						typeof data ===
						"string"
					) {

						try {

							data =
								JSON.parse(
									data
								);

						}

						catch (error) {

							return;

						}

					}


					if (
						data.type ===
						"chat"
					) {

						addMessage(

							data.name ||
							playerNames[
								remotePeerId
							] ||
							"Unknown",

							data.text ||
							""

						);

					}


					if (
						data.type ===
						"user_joined"
					) {

						if (
							data.peerId
						) {

							playerNames[
								data.peerId
							] =
								data.name ||
								"Unknown";

						}

					}


					if (
						data.type ===
						"user_left"
					) {

						systemMessage(

							(
								data.name ||
								"Someone"
							) +
							" left the lobby."

						);

					}

				};


			channel.onclose =
				function() {

					removeConnection(
						remotePeerId
					);

				};

		}


		/* =====================================================
		   REMOVE CONNECTION
		   ===================================================== */

		function removeConnection(
			peerId
		) {

			if (
				peerConnections[
					peerId
				]
			) {

				try {

					peerConnections[
						peerId
					].close();

				}

				catch (error) {}

			}


			delete peerConnections[
				peerId
			];


			delete dataChannels[
				peerId
			];


			delete playerNames[
				peerId
			];


			statusElement.textContent =
				"Connected players: " +
				countConnections();

		}


		/* =====================================================
		   COUNT CONNECTIONS
		   ===================================================== */

		function countConnections() {

			var count =
				0;


			for (
				var id in dataChannels
			) {

				if (
					dataChannels[id] &&
					dataChannels[id].readyState ===
					"open"
				) {

					count++;

				}

			}


			return count +
				(isHost ? 1 : 0);

		}


		/* =====================================================
		   HANDLE REMOTE SIGNAL
		   ===================================================== */

		function handleRemoteSignal(
			fromPeerId,
			payload
		) {

			if (
				!payload ||
				!fromPeerId
			) {

				return;

			}


			var pc =
				peerConnections[
					fromPeerId
				];


			if (
				!pc
			) {

				pc =
					createConnection(
						fromPeerId,
						false
					);

			}


			/*
			 * OFFER
			 */

			if (
				payload.kind ===
				"offer"
			) {

				pc.setRemoteDescription(

					new RTCSessionDescription(
						payload.description
					)

				)

				.then(

					function() {

						return pc.createAnswer();

					}

				)

				.then(

					function(answer) {

						return pc.setLocalDescription(
							answer
						);

					}

				)

				.then(

					function() {

						sendSignal(

							fromPeerId,

							{

								kind:
									"answer",

								description:
									pc.localDescription

							}

						);

					}

				)

				.catch(

					function(error) {

						systemMessage(
							"Signal error: " +
							error.message
						);

					}

				);

			}


			/*
			 * ANSWER
			 */

			else if (
				payload.kind ===
				"answer"
			) {

				pc.setRemoteDescription(

					new RTCSessionDescription(
						payload.description
					)

				)

				.catch(

					function(error) {

						systemMessage(
							"Answer error: " +
							error.message
						);

					}

				);

			}


			/*
			 * ICE CANDIDATE
			 */

			else if (
				payload.kind ===
				"candidate"
			) {

				if (
					pc.remoteDescription
				) {

					pc.addIceCandidate(

						new RTCIceCandidate(
							payload.candidate
						)

					)

					.catch(
						function() {}
					);

				}

			}

		}


		/* =====================================================
		   RELAY MESSAGES
		   ===================================================== */

		window.addEventListener(

			"message",

			function(event) {

				if (
					!signalWindow ||
					event.source !==
					signalWindow
				) {

					return;

				}


				var msg =
					event.data ||
					{};


				if (
					msg.room &&
					msg.room !==
					currentRoom
				) {

					return;

				}


				/* =============================================
				   RELAY CONNECTED
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"connected"
				) {

					relayReady =
						true;


					myPeerId =
						msg.peerId ||
						myPeerId;


					sendNameToRelay();

					flushSignalQueue();


					return;

				}


				/* =============================================
				   ROOM CREATED
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"room_created"
				) {

					relayReady =
						true;

					isHost =
						true;


					myPeerId =
						msg.peerId ||
						myPeerId;


					sendNameToRelay();

					flushSignalQueue();


					statusElement.textContent =
						"Lobby created. Waiting for players...";


					systemMessage(
						"You created the lobby."
					);


					return;

				}


				/* =============================================
				   LOBBY EXISTS
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"lobby_exists"
				) {

					statusElement.textContent =
						"Lobby found. Joining...";


					closeRelay();


					setTimeout(

						function() {

							openRelay(
								"join"
							);

						},

						250

					);


					return;

				}


				/* =============================================
				   NEW PLAYER
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"user_joined"
				) {

					if (
						msg.peerId
					) {

						playerNames[
							msg.peerId
						] =
							msg.name ||
							"Unknown";


						systemMessage(

							(
								msg.name ||
								"Someone"
							) +
							" joined the lobby."

						);


						/*
						 * HOST creates a direct
						 * WebRTC connection to
						 * the new player.
						 */

						if (
							isHost
						) {

							createConnection(
								msg.peerId,
								true
							);

						}

					}


					return;

				}


				/* =============================================
				   SIGNAL DATA
				   ============================================= */

				if (
					msg.type ===
					"signal_data"
				) {

					handleRemoteSignal(

						msg.from,

						msg.payload

					);


					return;

				}


				/* =============================================
				   PLAYER LEFT
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"user_left"
				) {

					if (
						msg.peerId
					) {

						systemMessage(

							(
								msg.name ||
								"Someone"
							) +
							" left the lobby."

						);


						removeConnection(
							msg.peerId
						);

					}


					return;

				}


				/* =============================================
				   RELAY ERROR
				   ============================================= */

				if (
					msg.type ===
					"relay_event" &&
					msg.peerEvent ===
					"error"
				) {

					statusElement.textContent =
						"Relay error";


					systemMessage(

						msg.detail ||
						"Unknown relay error."

					);


					return;

				}

			}

		);


		/* =====================================================
		   SEND CHAT
		   ===================================================== */

		function sendChat() {

			var text =
				messageInput.value.trim();


			if (
				text ===
				""
			) {

				return;

			}


			/*
			 * Display our own message.
			 */

			addMessage(
				myName,
				text
			);


			var message = {

				type:
					"chat",

				name:
					myName,

				text:
					text

			};


			/*
			 * Send directly to every
			 * WebRTC connection.
			 */

			for (
				var peerId in dataChannels
			) {

				var channel =
					dataChannels[
						peerId
					];


				if (
					channel &&
					channel.readyState ===
					"open"
				) {

					try {

						channel.send(
							JSON.stringify(
								message
							)
						);

					}

					catch (error) {}

				}

			}


			messageInput.value =
				"";

			messageInput.focus();

		}


		sendButton.onclick =
			sendChat;


		messageInput.onkeydown =
			function(event) {

				if (
					event.key ===
					"Enter"
				) {

					sendChat();

				}

			};


		/* =====================================================
		   START LOBBY
		   ===================================================== */

		function joinLobby() {

			currentRoom =
				"main";


			relayReady =
				false;


			isHost =
				false;


			statusElement.textContent =
				"Creating lobby...";


			openRelay(
				"create"
			);

		}


		/* =====================================================
		   ENTER LOBBY
		   ===================================================== */

		function enterLobby() {

			var name =
				nameInput.value.trim();


			if (
				name ===
				""
			) {

				nameInput.focus();

				return;

			}


			if (
				hasJoined
			) {

				return;

			}


			hasJoined =
				true;


			myName =
				name;


			nameScreen.style.display =
				"none";


			chatScreen.style.display =
				"flex";


			joinLobby();

		}


		joinButton.onclick =
			enterLobby;


		nameInput.onkeydown =
			function(event) {

				if (
					event.key ===
					"Enter"
				) {

					enterLobby();

				}

			};

	</script>

</body>
